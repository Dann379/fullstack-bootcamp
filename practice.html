<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Pactica CSS</title>
</head>

<body>
  <h2>Hobbies</h2>
  <ul>
    <li>fotografía</li>
    <li>videojuegos</li>
    <li>puzzles</li>
  </ul>

  <h2>Amigos</h2>
  <table>
    <tr>
      <th>Nombre</th>
      <th>Edad</th>
      <th>Ciudad</th>
    </tr>
    <tr>
      <td>Erick</td>
      <td>35</td>
      <td>CDMX</td>
    </tr>
    <tr>
      <td>Lalo</td>
      <td>23</td>
      <td>CDMX</td>
    </tr>
    <tr>
      <td>Kevin</td>
      <td>34</td>
      <td>Puebla</td>
    </tr>
  </table>

  <h2>Formulario</h2>
  <form>
    <label>Nombre:</label><br>
    <input type="text" placeholder="Escribe aqui tu nombre">
    <br>
    <label>Email:</label><br>
    <input type="email" placeholder="tu@correo.com">
    <br>
    <label>Mensaje:</label><br>
    <textarea placeholder="Escribe tu mensaje..."></textarea>
    <br>
    <button type="submit">Enviar</button>
  </form>
</body>

</html>
